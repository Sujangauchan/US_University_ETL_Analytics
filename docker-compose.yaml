services:
  superset:
    build:
      context: ./Superset
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=changeme_generate_a_real_one_later
    volumes:
      - ./Storage:/app/storage
      - superset_home:/app/superset_home

volumes:
  superset_home: